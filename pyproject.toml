[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskflow-batches"
version = "0.1.0"
description = "Batch task editing with time-limited, out-of-order undo, backed by SQLite"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["deskflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
